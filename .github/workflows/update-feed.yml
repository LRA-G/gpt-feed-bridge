name: Update GPT reading feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-gpt-reading-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.gpt_feed_bridge --config config.json

      - name: Commit feed and state
        run: |
          git config user.name "gpt-feed-bridge"
          git config user.email "gpt-feed-bridge@users.noreply.github.com"
          git add docs/feed.xml docs/status.json data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update GPT reading feed"
          git push

